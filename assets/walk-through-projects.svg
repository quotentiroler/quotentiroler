<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128" role="img" aria-label="Walk through my projects, enter the 3D museum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1b2140" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="4" y="4" width="632" height="120" rx="18" fill="url(#bg)"/>
    <rect x="4" y="4" width="632" height="120" rx="18" fill="url(#sheen)"/>
    <rect x="4.75" y="4.75" width="630.5" height="118.5" rx="17.25" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- footsteps motif -->
  <g fill="#ffffff" fill-opacity="0.5">
    <ellipse cx="48" cy="74" rx="6" ry="9" transform="rotate(-18 48 74)"/>
    <ellipse cx="70" cy="58" rx="6" ry="9" transform="rotate(-18 70 58)"/>
    <ellipse cx="92" cy="74" rx="6" ry="9" transform="rotate(-18 92 74)"/>
  </g>

  <text x="320" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Walk through my projects</text>
  <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.5" fill="#ffffff" fill-opacity="0.9">ENTER THE 3D MUSEUM &#8594;</text>
</svg>
